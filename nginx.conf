server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, nginx corta cualquier subida >1MB con 413 (el default de
    # client_max_body_size), aunque MAX_UPLOAD_MB en la API sea más grande —
    # en desarrollo (sin nginx delante) esto no se notaba, pero en producción
    # detrás de este proxy la subida de documentos fallaba silenciosamente
    # para archivos medianos/grandes.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    sendfile on;
    tcp_nopush on;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
