services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itplus
      POSTGRES_PASSWORD: itplus
      POSTGRES_DB: consulta_db
    ports:
      # Solo localhost: api/worker se conectan por la red interna de Docker
      # (no necesitan este puerto publicado). Publicarlo en 0.0.0.0 expondría
      # Postgres sin auth real (contraseña == usuario) a cualquiera que
      # alcance este host por red, si el host tiene IP pública.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itplus -d consulta_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      # Mismo motivo que Postgres: sin password configurado, publicarlo en
      # 0.0.0.0 lo dejaría abierto a cualquiera con acceso de red al host.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://itplus:itplus@postgres:5432/consulta_db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python itplus/scripts/seed_admin.py &&
             uvicorn run_itplus:app --host 0.0.0.0 --port 8000"
    # Antes: sin healthcheck ni restart, si init_db()/seed_admin fallaba al
    # arrancar (p. ej. Postgres tardó en aceptar conexiones) el contenedor
    # moría y se quedaba abajo para siempre — nadie lo reiniciaba.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://itplus:itplus@postgres:5432/consulta_db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A itplus.app.workers.celery_app:celery_app inspect ping -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
